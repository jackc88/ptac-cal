name: Update PTAC Calendars

on:
  schedule:
    # Runs every day at 05:00 UTC (1:00 AM EDT / 12:00 AM EST)
    - cron: '0 5 * * *'
  workflow_dispatch:   # Allows manual runs from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate calendars
        run: python ptac_sync.py --with-addresses

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the important files
          git add output/ last_content_hash.txt run.log

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update PTAC calendars $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
